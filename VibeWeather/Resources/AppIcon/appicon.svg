<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456">
    <!-- Launcher icon background: a dusk-blue sky (the brand's cold end, deepened), so the icon stands out on light and
         dark home screens alike. appiconfg.svg cuts the cloud's halo with the same gradient. -->
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="456" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#3A4E6B" />
            <stop offset="1" stop-color="#243047" />
        </linearGradient>
    </defs>
    <rect width="456" height="456" fill="url(#sky)" />
</svg>
