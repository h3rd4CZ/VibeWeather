<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
    <!-- Themed-icon layer (Android 13+): the Orb in one colour, placed like appiconfg.svg (scaled to 108). The halo
         is a transparent gap here (widened by 3 units), so the sun and cloud stay two shapes when tinted. -->
    <defs>
        <mask id="halo" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
            <rect width="100" height="100" fill="#fff" />
            <g fill="#000">
                <rect x="12" y="53" width="76" height="38" rx="19" />
                <circle cx="40" cy="57" r="24" />
                <circle cx="63" cy="63" r="19" />
            </g>
        </mask>
    </defs>
    <g transform="translate(27.95 26.9) scale(0.5211)">
        <circle cx="60" cy="40" r="29" fill="#fff" mask="url(#halo)" />
        <g fill="#fff">
            <rect x="19" y="60" width="62" height="24" rx="12" />
            <circle cx="40" cy="57" r="17" />
            <circle cx="63" cy="63" r="12" />
        </g>
    </g>
</svg>
