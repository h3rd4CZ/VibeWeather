<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 100 100">
    <!-- Status-bar icon, morning summary: the Orb, white on transparent, with a wide gap so it reads at 24 dp. -->
    <defs>
        <mask id="halo" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
            <rect width="100" height="100" fill="#fff" />
            <g fill="#000">
                <rect x="12" y="53" width="76" height="38" rx="19" />
                <circle cx="40" cy="57" r="24" />
                <circle cx="63" cy="63" r="19" />
            </g>
        </mask>
    </defs>
    <circle cx="60" cy="40" r="29" fill="#fff" mask="url(#halo)" />
    <g fill="#fff">
        <rect x="19" y="60" width="62" height="24" rx="12" />
        <circle cx="40" cy="57" r="17" />
        <circle cx="63" cy="63" r="12" />
    </g>
</svg>
